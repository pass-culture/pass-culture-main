# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.

name: 3 [CI] Check GitHub Actions lockfile

on:
  workflow_call:
  # FIXME: remove before merge
  push:
    branches:
    - fseguin/PC-44521-gha-lockile

permissions:
  contents: read

jobs:
  verify:
    name: Check GHA lockfile is up-to-date
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --migrate-local-actions --verify
