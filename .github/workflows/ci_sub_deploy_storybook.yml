name: 3 [CI] Build and deploy Storybook

on: workflow_call

jobs:
  build-and-deploy-storybook:
    name: Build and deploy Storybook
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@a67aba1f7a63bcb20f5b722557a4bdcba2511ab5
      - run: pnpm ci
        working-directory: pro
      - run: pnpm build-storybook
        working-directory: pro
      - name: Deploy Storybook on GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "docs"
          folder: "pro/docs-build"
          clean: true
          target-folder: "docs"
