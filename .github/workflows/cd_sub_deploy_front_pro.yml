name: 3 [CD] Deploy front PRO

on:
  workflow_dispatch:
    inputs:
      ENV:
        type: string
        required: true
      PUSH_RELEASE_TO_SENTRY:
        description: "If true, creates a release in Sentry and uploads sourcemaps"
        type: boolean
        default: false
      CHANNEL:
        type: string
        required: true
      EXPIRES:
        type: string
        default: "2d"
      REF:
        type: string
        required: true
      resource_label:
        type: string
        # TODO check if a default is needed
        default: ""
      continue_on_error:
        type: boolean
        required: false
        default: false
      version:
        type: string
        required: true
      firebase_cli_version:
        description: "Version of firebase-tools to use for deployment"
        type: string
        required: false
        default: 15.18.0
  workflow_call:
    inputs:
      ENV:
        type: string
        required: true
      PUSH_RELEASE_TO_SENTRY:
        description: "If true, creates a release in Sentry and uploads sourcemaps"
        type: boolean
        default: false
      CHANNEL:
        type: string
        required: true
      EXPIRES:
        type: string
        default: "2d"
      REF:
        type: string
        required: true
      resource_label:
        type: string
        # TODO check if a default is needed
        default: ""
      continue_on_error:
        type: boolean
        required: false
        default: false
      version:
        type: string
        required: true
      firebase_cli_version:
        description: "Version of firebase-tools to use for deployment"
        type: string
        required: false
        default: 15.18.0
    outputs:
      pro_url:
        description: "The pro (firebase) preview URL"
        value: ${{ jobs.deploy_on_firebase.outputs.pro_url }}
    secrets:
      PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY: { required: true }
      PASSCULTURE_GITHUB_ACTION_APP_ID: { required: true }

defaults:
  run:
    working-directory: pro

jobs:
  deploy_on_firebase:
    environment:
      name: pro-${{ inputs.ENV }}
      deployment: false
    runs-on: ubuntu-22.04
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    outputs:
      description: "The pro (firebase) preview URL"
      pro_url: ${{ steps.deploy.outputs.preview_url }}
    continue-on-error: ${{ inputs.continue_on_error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@6483091347df28b22c7b10d39bb6e3e058d7278a
      - name: "OpenID Connect Authentication"
        id: "openid-auth"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          export_environment_variables: "true"
          create_credentials_file: "true"
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
          service_account: ${{ vars.PRO_DEPLOY_SERVICE_ACCOUNT }}
      - name: "Get Secret"
        id: "secrets"
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SAAS_SENTRY_TOKEN:passculture-metier-ehp/passculture-app-pro-saas-sentry-token
      - if: inputs.resource_label != ''
        env:
          RESOURCE_LABEL: ${{ inputs.resource_label }}
        run: |
          sed -i "s/https:\/\/backend.testing.passculture.team/https:\/\/backend-$RESOURCE_LABEL.testing.passculture.team/g" src/.env.testing
      - name: "Install dependencies (3 attempts)"
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: |
            cd pro
            pnpm ci
      - run: pnpm build:"$ENV"
        env:
          # By default NodeJS processes are limited to 512MB of memory
          # This is not enough for the build process when compiling sourcemaps
          # Increases the limit so that the build doesnt fail
          NODE_OPTIONS: --max_old_space_size=4096
          ENV: ${{ inputs.ENV }}
          VITE_APP_VERSION: ${{ inputs.version }}
      - if: inputs.ENV != 'testing'
        run: |
          grep -E '"version": "[0-9]+.[0-9]+.[0-9]+"' package.json | grep -Eo '[0-9]+.[0-9]+.[0-9]+' > build/version.txt
      - name: "Create SaaS Sentry release"
        if: ${{ inputs.PUSH_RELEASE_TO_SENTRY }}
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ steps.secrets.outputs.SAAS_SENTRY_TOKEN }}
          SENTRY_ORG: pass-culture
          SENTRY_PROJECT: pro
        with:
          sourcemaps: ./build
          working_directory: pro
          version: ${{ inputs.CHANNEL }}
          url_prefix: "~"

      - name: Install passdirector
        uses: pass-culture/common-workflows/actions/setup-passdirector@b470d76b19d7f3ebcda367f5e17484228021d388 # v1.0.0
        with:
          version: v0.7.2
          github_app_id: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID}}
          github_app_private_key: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY}}

      - name: Setup firebase
        env:
          FIREBASE_CLI_VERSION: ${{ inputs.firebase_cli_version }}
        run: |
          npm install -g "firebase-tools@$FIREBASE_CLI_VERSION"

      - name: Deploy pro on specific channel
        working-directory: pro
        id: deploy
        env:
          REF_NAME: ${{ github.ref_name }}
          ENV: ${{ inputs.ENV }}
          CHANNEL: ${{ inputs.CHANNEL }}
        run: |
          URL=$(passdirector firebase deploy-preview --project-id "pc-pro-${ENV}" --target "pc-pro-${ENV}" --channel "${CHANNEL}")
          echo "preview_url=$URL" | tee -a "$GITHUB_OUTPUT"

      - name: "Publish Summary"
        run: |
          {
            echo "### :rocket: Deploy PRO summary"
            echo "| Results                              | Value |"
            echo "| ------------------------------------ | ----- |"
            echo "| [pro] preview url                    |  ${{ steps.deploy.outputs.preview_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
