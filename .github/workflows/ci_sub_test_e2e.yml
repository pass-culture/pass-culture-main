name: 3 [CI] Test E2E

on:
  workflow_call:
    inputs:
      ENV:
        type: string
        required: true
      image:
        type: string
        required: false
        default: pcapi-tests
      tag:
        type: string
        required: true

defaults:
  run:
    working-directory: pro

jobs:
  install:
    name: "Install Playwright E2E 🔧"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"

      - uses: pass-culture/common-workflows/actions/setup-safe-chain@setup-pcsi/v1.0

      - name: "Cache the node_modules"
        uses: pass-culture-github-actions/cache@v1.0.0
        with:
          compression-method: "gzip"
          path: |
            **/node_modules
          key: v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
          restore-keys: |
            v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm ci

      - name: Build vite application
        env:
          ENV: ${{ inputs.ENV }}
        run: pnpm run "build:$ENV"

      - name: Save build folder
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-playwright
          if-no-files-found: error
          path: pro/build

  run-playwright-tests:
    name: Run Playwright tests
    runs-on: ubuntu-24.04
    needs: [install]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: "pnpm"
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"

      - uses: pass-culture/common-workflows/actions/setup-safe-chain@setup-pcsi/v1.0

      - uses: KengoTODA/actions-setup-docker-compose@v1.2.8
        with:
          version: "2.40.3"

      - name: "Fix local permissions"
        run: sudo chown -R "$PCAPI_UID:$PCAPI_GID" .
        working-directory: api
        env:
          PCAPI_UID: 1000
          PCAPI_GID: 1000

      - name: "Cache the node_modules"
        uses: pass-culture-github-actions/cache@v1.0.0
        with:
          compression-method: "gzip"
          path: |
            **/node_modules
          key: v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
          restore-keys: |
            v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pro/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: "Compute docker image name:tag"
        id: compute-image-name
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "image_name=$IMAGE:$TAG" | tee -a "${GITHUB_OUTPUT}"
          echo "::notice:: Running playwright e2e-tests with $IMAGE:$TAG"

      - name: "Run postgres and redis server"
        run: docker-compose -f ../docker-compose-backend.yml up postgres redis -d

      - name: "Download artifact"
        if: ${{ inputs.tag != 'latest' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.image }}-${{ inputs.tag }}.tar
          path: ${{ runner.temp }}

      - name: "Run API server"
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          E2E_API_KEY: DummyToken
          TEMP: ${{ runner.temp }}
          IMAGE_NAME: ${{ steps.compute-image-name.outputs.image_name }}
        run: |
          if [ "$TAG" != "latest" ]; then
            docker load --input "$TEMP/$IMAGE-$TAG.tar"
          fi
          docker run \
            --name pc-api \
            --workdir /usr/src/app \
            --env-file ./../env_file \
            --tty \
            --detach \
            --network pass-culture-main_db_nw \
            --publish 5001:5001 \
            --publish 10002:10002 \
            --entrypoint bash \
            --env E2E_API_KEY=DummyToken \
            --env ENABLE_FLASK_PROMETHEUS_EXPORTER="0" \
            --env PROMETHEUS_MULTIPROC_DIR="" \
            "$IMAGE_NAME" \
            -c "set -e ; flask install_postgres_extensions ; alembic upgrade pre@head ; alembic upgrade post@head ; flask install_data ; FLASK_USE_RELOADER=0 python src/pcapi/app.py"

      - name: "Wait for migrations to be run"
        uses: iFaxity/wait-on-action@v1.2.1
        with:
          resource: http://localhost:5001/health/api
          timeout: 120000

      - name: Download the build folder
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-playwright
          path: pro/build

      - name: "Serve vite preview"
        run: pnpm serve &

      - name: "Wait for front-end to listen"
        run: |
          # shellcheck disable=SC2016
          timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:3001)" != "200" ]]; do sleep 5; done' || false

      - name: "Playwright run"
        run: E2E_API_KEY=DummyToken pnpm test:e2e:ci --reporter=blob --shard="$SHARD_INDEX/$SHARD_TOTAL"
        env:
          E2E_API_KEY: DummyToken
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{matrix.shardTotal }}

      - name: "Upload Playwright report"
        uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-chromium-${{ matrix.shardIndex }}
          path: pro/blob-report/
          retention-days: 30

      - name: "Show pcapi log when it fails"
        if: failure()
        run: docker logs pc-api

  merge-reposrts:
    if: ${{ !cancelled() }}
    needs: [run-playwright-tests]
    name: "Merge playwright reports"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@setup-pcsi/v1.0

      - name: "Install dependencies (3 attempts)"
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: |
            cd pro
            pnpm ci

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: pro/all-blob-reports
          pattern: report-chromium-*
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: pro/playwright-report
          retention-days: 14
