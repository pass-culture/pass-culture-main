name: 3 [CI] Test frontend

on:
  workflow_call:

defaults:
  run:
    working-directory: pro

jobs:
  run-quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@a67aba1f7a63bcb20f5b722557a4bdcba2511ab5
      - name: "Cache the node_modules"
        id: "pnpm-modules-cache"
        uses: pass-culture-github-actions/cache@v1.0.0
        with:
          compression-method: "gzip"
          bucket: ${{ vars.CACHE_BUCKET }}
          path: |
            **/node_modules
          key: v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
          restore-keys: |
            v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
      - name: "Install dependencies (3 attempts)"
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: |
            cd pro
            pnpm ci

      - run: pnpm typecheck
      - run: pnpm lint:dead-code
      - run: pnpm lint:dead-code:production
      - run: pnpm lint:js
      - run: pnpm lint:scss
      - run: pnpm lint:scss:checkunused

  run-unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@a67aba1f7a63bcb20f5b722557a4bdcba2511ab5

      - name: "OpenID Connect Authentication"
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
          service_account: ${{ vars.PRO_CI_SERVICE_ACCOUNT }}

      - name: "Cache the node_modules"
        id: "pnpm-modules-cache"
        uses: pass-culture-github-actions/cache@v1.0.0
        with:
          compression-method: "gzip"
          bucket: ${{ vars.CACHE_BUCKET }}
          path: |
            **/node_modules
          key: v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
          restore-keys: |
            v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}

      - name: "Install dependencies (3 attempts)"
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: |
            cd pro
            pnpm ci

      - name: Run tests with coverage
        run: pnpm test:unit:ci --reporter=blob --reporter=dot --shard="$SHARD_INDEX/$SHARD_TOTAL"
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}

      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: pro/.vitest-reports/
          include-hidden-files: true
          retention-days: 1

      - name: Rename coverage
        run: mv coverage/coverage-final.json "coverage/coverage-$SHARD_INDEX.json"
        env:
          SHARD_INDEX: ${{matrix.shardIndex}}

      - name: Upload coverage report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report-${{ matrix.shardIndex }}
          path: pro/coverage/*.json
          include-hidden-files: true
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: run-unit-tests

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Needed to fix `Shallow clone detected during the analysis.` error on sonar side
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"
      - uses: pass-culture/common-workflows/actions/setup-safe-chain@a67aba1f7a63bcb20f5b722557a4bdcba2511ab5

      - name: "Cache the node_modules"
        id: "pnpm-modules-cache"
        uses: pass-culture-github-actions/cache@v1.0.0
        with:
          compression-method: "gzip"
          bucket: ${{ vars.CACHE_BUCKET }}
          path: |
            **/node_modules
          key: v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
          restore-keys: |
            v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}

      - name: "Install dependencies (3 attempts)"
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: |
            cd pro
            pnpm ci

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: pro/.vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec vitest --merge-reports --reporter=dot

      - name: Download coverage reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: pro/coverage
          pattern: coverage-report-*
          merge-multiple: true

      - name: Merge coverage reports
        run: |
          pnpm dlx nyc merge coverage coverage/coverage-merged.json
          pnpm dlx nyc report -t coverage --report-dir coverage --reporter lcov

      - name: "OpenID Connect Authentication"
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PRD }}
          service_account: ${{ vars.PRO_CI_SERVICE_ACCOUNT }}

      - name: "Get Secret"
        id: "secrets"
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: |-
            SONAR_TOKEN:passculture-metier-ehp/passculture-main-sonar-token

      - name: "Compute project version from the latest production release"
        id: project-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(gh release view --json tagName -q .tagName | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ steps.secrets.outputs.SONAR_TOKEN }}
        with:
          projectBaseDir: pro
          args: -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' && 'true' || 'false'  }} -Dsonar.projectVersion=${{ steps.project-version.outputs.version }}
