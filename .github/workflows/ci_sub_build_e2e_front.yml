name: 3 [CI] Build E2E front

on:
  workflow_call:
    inputs:
      ENV:
        type: string
        required: true

defaults:
  run:
    working-directory: pro

jobs:
  install:
    name: "Install Playwright E2E 🔧"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: pro/package.json

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: "pro/package.json"
          cache-dependency-path: "pro/pnpm-lock.yaml"

      - uses: pass-culture/common-workflows/actions/setup-safe-chain@a67aba1f7a63bcb20f5b722557a4bdcba2511ab5

      - name: "Cache the node_modules"
        uses: pass-culture-github-actions/cache@88f07af200f0bcf2480f9c194e3dbb9488a1902b # v1.0.0
        with:
          compression-method: "gzip"
          path: |
            **/node_modules
          key: v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}
          restore-keys: |
            v1-pnpm-pro-dependency-cache-${{ runner.os }}-${{ hashFiles('pro/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm ci

      - name: Build vite application
        env:
          ENV: ${{ inputs.ENV }}
        run: pnpm run "build:$ENV"

      - name: Save build folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-playwright
          if-no-files-found: error
          path: pro/build
