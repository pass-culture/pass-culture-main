  "google-cloud-tasks==2.23.0",
  "googleapis-common-protos ==1.75.0",
  "googlemaps ==4.10.0",
  "gql[requests] ==4.0.0",
  "gunicorn==26.0.0",
  "html5lib ==1.1",
  "ipython==9.16.1",
  "jinja2 ==3.1.6",
  "libsass ==0.23.0",
  "markupsafe ==3.0.3",
  "openpyxl ==3.1.5",
  "phonenumberslite==9.0.36",
  "pillow==12.3.0",
  "prometheus-flask-exporter ==0.23.2",
