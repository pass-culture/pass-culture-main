[dependency-groups]
dev = [
  "commitizen==4.17.0",
  "debugpy==1.8.21",
  "djlint==1.44.0",
  "fakeredis==2.37.0",
  "ipdb==0.13.13",
  "jsbeautifier==2.0.3",                  # djlint requires 1.15.1 which is broken
  "mypy==2.3.0",
  "pgcli==4.5.0",
  "psycopg[binary]==3.3.4",
  "pytest==9.1.1",
  "pytest-dotenv ==0.5.2",
  "pytest-flask ==1.3.0",
  "pytest-mock ==3.15.1",
  "pytest-socket==0.8.0",
  "pytest-split ==0.11.0",
  "requests-mock ==1.12.1",
  "ruff==0.16.0",
  "squawk-cli==2.62.0",
  "types-protobuf==7.34.1.20260518",
  "types-python-dateutil==2.9.0.20260716",
  "types-pytz==2026.3.1.20260727",
  "types-pyyaml==6.0.12.20260724",
  "types-redis ==4.6.0.20241004",
  "types-requests==2.33.0.20260712",
  "types-urllib3 ==1.26.25.14",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.13"
mypy_path = "stubs/"
disallow_untyped_defs = true
ignore_missing_imports = true
show_column_numbers = true
warn_unused_ignores = true
show_error_codes = true
warn_redundant_casts = true
local_partial_types = true
plugins = "pydantic.mypy"
exclude = """
(?x)(
    tests/.*
    | src/pcapi/alembic/.*
    | src/pcapi/scripts/local_debug_script.py
  )
"""

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
extend-select = [
  "I",       # isort
  "D419",    # empty-docstring
  "W291",    # trailing-whitespace
  "PLC0414", # useless-import-alias
  "PLC2401", # non-ascii-name
  "PLC3002", # unnecessary-direct-lambda-call
  "PLE0101", # return-in-init
  "F706",    # return-outside-function
  "F704",    # yield-outside-function
  "PLE0115", # nonlocal-and-global
  "PLE0116", # continue-in-finally
  "PLE0117", # nonlocal-without-binding
  "PLE0241", # duplicate-bases
  "PLE0302", # unexpected-special-method-signature
  "PLE0604", # invalid-all-object
  "PLE0605", # invalid-all-format
  "PLE0643", # potential-index-error
  "PLE0704", # misplaced-bare-raise
  "PLE1205", # logging-too-many-args
  "PLE1206", # logging-too-few-args
  "PLE1307", # bad-string-format-type
  "PLE1310", # bad-str-strip-call
  "PLE1507", # invalid-envvar-value
  "PLE1519", # singledispatch-method
  "PLE1520", # singledispatchmethod-function
  "PLE2502", # bidirectional-unicode
  "PLE2510", # invalid-character-backspace
  "PLE2512", # invalid-character-sub
  "PLE2513", # invalid-character-esc
  "PLE2514", # invalid-character-nul
  "PLE2515", # invalid-character-zero-width-space
  "UP004",   # useless-object-inheritance
  "PLR0206", # property-with-parameters
  "PLR1704", # redefined-argument-from-local
  "PLR1711", # useless-return
  "C416",    # unnecessary-comprehension
  "PLR1736", # unnecessary-list-index-lookup
  "PLW0120", # useless-else-on-loop
  "PLW0127", # self-assigning-variable
  "PLW0128", # redeclared-assigned-name
  "PLW0129", # assert-on-string-literal
  "B033",    # duplicate-value
  "PLW0131", # named-expr-without-context
  "PLW0211", # bad-staticmethod-argument
  "PLW0245", # super-without-brackets
  "PLW0406", # import-self
  "PLW0602", # global-variable-not-assigned
  "PLW0603", # global-statement
  "PLW0604", # global-at-module-level
  "F401",    # unused-import
  "F841",    # unused-variable
  "E722",    # bare-except
  "PLW0711", # binary-op-exception
  "PLW1501", # bad-open-mode
  # "PLW1508",  # invalid-envvar-default not compatible by what is done in settings.py
  "PLW1509", # subprocess-popen-preexec-fn
  "PLW2101", # useless-with-lock
  "PLW3301", # nested-min-max
  # "E501",  # line-too-long
  # "PLR0904",  # too-many-public-methods -> preview mode only
  # "PLR0911",  # too-many-return-statements
  # "PLR0912",  # too-many-branches
  # "PLR0913",  # too-many-arguments
  # "PLR0914",  # too-many-locals -> preview mode only
  # "PLR0915",  # too-many-statements
  # "PLR0917",  # too-many-positional-arguments -> preview mode only
  "S704",   # unsafe-markup-use
  "TID251", # banned-api (requests)
  "DTZ003", # call-datetime-utcnow
]

ignore = [
  "E712", # Avoid equality comparisons to `True`; use `if offer.audioDisabilityCompliant:` for truth checks (issue in assert)
  "E711", # Use 'is' instead of '==' to test for None -> several incompatibilities with SQLAlchemy

  # a lot of rules have been added in 0.16.0, we ignore the following for now and will decide later for each rule if we fix it or leave it ignored
  "B006",  # mutable-argument-default : Do not use mutable data structures for argument defaults
  "B008",  # function-call-in-default-argument : Do not perform function calls in argument defaults
  "B009",  # get-attr-with-constant : Do not call `getattr` with a constant attribute value
  "B010",  # set-attr-with-constant : Do not call `setattr` with a constant attribute value
  "B013",  # redundant-tuple-in-exception-handler : A length-one tuple literal is redundant in exception handlers
  "B015",  # useless-comparison : Pointless comparison. This comparison does nothing but waste CPU instructions
  "B017",  # assert-raises-exception : `pytest.raises(Exception)` should be considered evil
  "B018",  # useless-expression : Found useless expression. Either assign it to a variable or remove it
  "B019",  # cached-instance-method : Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
  "BLE001",  # blind-except : Do not catch blind exception: `Exception`
  "C400",  # unnecessary-generator-list : Unnecessary generator (rewrite as a `list` comprehension)
  "C401",  # unnecessary-generator-set : Unnecessary generator (rewrite as a `set` comprehension)
  "C403",  # unnecessary-list-comprehension-set : Unnecessary list comprehension (rewrite as a `set` comprehension)
  "C405",  # unnecessary-literal-set : Unnecessary literal (rewrite as a `set` literal)
  "C408",  # unnecessary-collection-call : Unnecessary collection call (rewrite as a literal)
  "C409",  # unnecessary-literal-tuple : Unnecessary literal passed to `tuple()` (rewrite as a `tuple` literal)
  "C414",  # nested-iterable : Unnecessary nested iterable
  "C417",  # unnecessary-map : Unnecessary `map` usage (rewrite using a generator expression or comprehension)
  "C419",  # unnecessary-comprehension-any-all : Unnecessary list comprehension passed to `any()` or `all()`
  "DTZ001",  # call-datetime-without-tzinfo : The use of `datetime.datetime()` without `tzinfo` argument is not allowed
  "DTZ002",  # call-datetime-today : The use of `datetime.datetime.today()` is not allowed
  "DTZ005",  # call-datetime-now-without-tzinfo : The use of `datetime.datetime.now()` without `tzinfo` argument is not allowed
  "DTZ006",  # call-datetime-fromtimestamp : The use of `datetime.datetime.fromtimestamp()` without `tzinfo` argument is not allowed
  "DTZ007",  # call-datetime-strptime-without-zone : The use of `datetime.datetime.strptime()` without %z must be followed by `.replace(tzinfo=)`
  "DTZ011",  # call-date-today : The use of `datetime.date.today()` is not allowed
  "DTZ901",  # datetime-min-max : `datetime.datetime.min` and `datetime.datetime.max` lack timezone information
  "EXE001",  # shebang-not-executable : Shebang is present but file is not executable
  "EXE002",  # shebang-missing-executable-file : The file is executable but no shebang is present
  "FLY002",  # static-join-to-f-string : Consider f-string instead of string join
  "FURB105",  # print-empty-string : Unnecessary empty string passed to `print`
  "FURB136",  # if-expr-min-max : Replace if-expression with `min()` or `max()`
  "FURB157",  # verbose-decimal-constructor : Use `Decimal()` rather than `Decimal("0")`
  "FURB163",  # redundant-log-base : `math.log()` base is redundant
  "FURB192",  # sorted-min-max : Prefer `min()` / `max()` over `sorted()`
  "G010",  # logging-warn : Logging statement uses `warn` instead of `warning`
  "G201",  # logging-exc-info : Logging `.exception(...)` should be used instead of `.error(..., exc_info=True)`
  "ISC004",  # implicit-string-concatenation-in-collection-literal : Implicitly concatenated string literals on one line
  "LOG015",  # root-logger-call : Use of root logger
  "PERF402",  # manual-list-copy : Use `list` or `list.copy` to create a copy of a list
  "PGH005",  # invalid-mock-access : Mock objects have no attribute
  "PIE790",  # unnecessary-placeholder : Unnecessary `pass` statement
  "PIE794",  # duplicate-class-field-definition : Class field is defined multiple times
  "PIE796",  # non-unique-enums : Enum contains duplicate value
  "PIE800",  # unnecessary-spread : Unnecessary spread `**`
  "PIE808",  # unnecessary-range-start : Unnecessary `start` argument in `range`
  "PIE810",  # multiple-starts-ends-with : Call `.startswith()` or `.endswith()` once with a tuple
  "PLC0206",  # dict-index-missing-items : Extracting value from dictionary without calling `.items()`
  "PLR0402",  # manual-from-import : Use `from module import name` in lieu of alias
  "PLW1508",  # invalid-envvar-default : Invalid type for environment variable default
  "PT014",  # pytest-duplicate-parametrize-test-cases : Duplicate test cases in `@pytest.mark.parametrize`
  "PYI009",  # pass-statement-stub-body : Empty body should contain `...`, not `pass`
  "PYI020",  # quoted-annotation-in-stub : Quoted annotations should not be included in stubs
  "PYI030",  # unnecessary-literal-union : Multiple literal members in a union
  "PYI034",  # non-self-return-type : `__new__` methods usually return `self` at runtime
  "PYI036",  # bad-exit-annotation : Star-args in `__exit__` should be annotated with `object`
  "PYI041",  # redundant-numeric-union : Use `float` instead of `int | float`
  "PYI052",  # unannotated-assignment-in-stub : Unannotated assignment in stub
  "PYI063",  # pep484-style-positional-only-parameter : Use PEP 570 syntax for positional-only arguments
  "RET501",  # unnecessary-return-none : Do not explicitly `return None` in function if it is the only possible return value
  "RUF010",  # explicit-f-string-type-conversion : Use explicit conversion flag
  "RUF012",  # mutable-class-default : Mutable class attributes should be annotated with `typing.ClassVar`
  "RUF013",  # implicit-optional : PEP 484 prohibits implicit `Optional`
  "RUF015",  # unnecessary-iterable-allocation-for-first-element : Prefer `next(iter(...))` over single element slice
  "RUF017",  # quadratic-list-summation : Avoid quadratic list summation
  "RUF018",  # assignment-in-assert : Avoid assignment expressions in `assert` statements
  "RUF019",  # unnecessary-key-check : Unnecessary key check before dictionary access
  "RUF022",  # unsorted-dunder-all : `__all__` is not sorted
  "RUF028",  # invalid-formatter-suppression-comment : `fmt: off` is not supported
  "RUF032",  # decimal-from-float-literal : Decimal constructor passed a float literal
  "RUF034",  # useless-if-else : Useless `if`-`else` condition
  "RUF046",  # unnecessary-cast-to-int : Unnecessary `int` cast
  "RUF059",  # unused-unpacked-variable : Unpacked variable is never used
  "RUF100",  # unused-noqa : Unused `noqa` directive
  "S110",  # try-except-pass : `try`-`except`-`pass` detected, consider logging the exception
  "SIM102",  # nested-if : Use a single `if` statement instead of nested `if` statements
  "SIM103",  # return-bool-condition-directly : Return the boolean condition directly
  "SIM113",  # enumerate-for-loop : Use `enumerate()` for index variable in `for` loop
  "SIM114",  # if-with-same-arms : Combine `if` branches using logical `or` operator
  "SIM115",  # open-file-with-context-handler : Use context handler for opening files
  "SIM117",  # multiple-with-statements : Use a single `with` statement with multiple contexts
  "SIM118",  # in-dict-keys : Use `key in dict` instead of `key in dict.keys()`
  "SIM201",  # negate-cmp-op-with-not : Use `!=` instead of `not ==`
  "SIM401",  # if-else-block-instead-of-dict-get : Use `dict.get(key, default)` instead of an `if` block
  "SIM905",  # split-static-string : Unnecessary string split
  "T100",  # debugger : Trace found: `breakpoint` used
  "TRY002",  # raise-vanilla-class : Create your own exception
  "TRY004",  # type-check-without-type-error : Prefer `TypeError` exception for invalid type
  "TRY201",  # verbose-raise : Use `raise` without specifying exception name
  "TRY401",  # verbose-log-message : Redundant exception object included in `logging.exception` call
  "UP006",  # non-pep585-annotation : Use standard library generic types instead of typing module
  "UP007",  # non-pep604-annotation : Use `X | Y` for type annotations
  "UP012",  # unnecessary-encode-utf8 : Unnecessary call to `encode` as UTF-8
  "UP017",  # datetime-timezone-utc : Use `datetime.UTC` alias
  "UP018",  # native-literals : Unnecessary native literal call
  "UP022",  # replace-stdout-stderr : Sending stdout and stderr to `PIPE` is deprecated, use `capture_output`
  "UP028",  # yield-in-for-loop : Replace `yield` over `for` loop with `yield from`
  "UP031",  # printf-string-formatting : Use format specifiers instead of percent format
  "UP032",  # f-string : Use f-string instead of `format` call
  "UP034",  # extraneous-parentheses : Avoid extraneous parentheses
  "UP035",  # deprecated-import : Import from standard library instead of deprecated modules
  "UP036",  # outdated-version-block : Version block is outdated for minimum Python version
  "UP037",  # quoted-annotation : Remove quotes from type annotation
  "UP040",  # non-pep695-type-alias : Type alias uses `TypeAlias` annotation instead of the `type` keyword
  "UP043",  # unnecessary-default-type-args : Unnecessary default type arguments
  "UP045",  # non-pep604-annotation-optional : Use `X | None` instead of `Optional[X]`
  "UP047",  # non-pep695-generic-function : Generic function uses `TypeVar` instead of the `type` keyword
  "UP049",  # private-type-parameter : Private type parameter
  "W605",  # invalid-escape-sequence : Invalid escape sequence
]

[tool.ruff.lint.flake8-tidy-imports]
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use `pcapi.utils.requests` instead."

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"] # unused-import -> required in some init files

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "tests",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
tests = ["tests"]

[tool.pytest.ini_options]
addopts = [
  "--verbose",
  "--tb=short",
  "--disable-socket",
  # Use network range 172.16.0.0/12 once pytest-socket supports it (https://github.com/miketheman/pytest-socket/pull/185)
  "--allow-hosts=127.0.0.1,::1,172.18.0.2,172.18.0.3,172.18.0.4,172.19.0.2,172.19.0.3,172.19.0.4,172.20.0.2,172.20.0.3,172.20.0.4,172.21.0.2,192.168.16.2", # allow connections to local Redis
  "-p no:warnings",
  "--pdbcls=IPython.terminal.debugger:TerminalPdb", # use ipdb as default debugger in pytest
]
filterwarnings = [
  # Mark warnings as errors
  "error",
]
testpaths = ["tests"]
norecursedirs = [".git", "venv", ".pytest_cache"]
python_files = ["*test.py", "test*.py"]
python_classes = ["*Test"]
python_functions = ["test_*", "when_*", "expect_*", "should_*"]
env_files = ["local_test_env_file"]
junit_family = "xunit1"
markers = ["backoffice", "features", "settings"]
requests_mock_case_sensitive = true
verbosity_assertions = 2

[tool.djlint]
profile="jinja"
