  "semver ==3.0.4",
  "sentry-sdk[flask,celery]==2.66.1",
  "shapely ==2.1.2",
  "slack-sdk==3.43.0",
  "spectree ==1.5.8",
  "sqlalchemy-easy-softdelete @ git+https://github.com/pass-culture/sqlalchemy-easy-softdelete.git",
